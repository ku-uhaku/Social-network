services:
  go:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - social-db:/app/internal/database
      - social-media:/app/media
    restart: unless-stopped
    networks:
      - social-network

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - go
    restart: unless-stopped
    networks:
      - social-network
networks:
  social-network:
    driver: bridge
volumes:
  social-db:
  social-media:
